# Release tags of app-ui itself: the signed tag check (F23) runs on every
# `v*` tag the maintainer pushes. The SBOM workflow verifies the tag again
# when the maintainer publishes the GitHub release.
name: release tag

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  signed-tag:
    uses: ./.github/workflows/signed-tag.yml
