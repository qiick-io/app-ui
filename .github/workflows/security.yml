name: Fleet security

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  conformance:
    uses: ./.github/workflows/fleet-security-check.yml
    with:
      security-txt: playground/public/.well-known/security.txt
  codeql:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
  scorecard:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/scorecard.yml
    permissions:
      contents: read
      id-token: write
      security-events: write
