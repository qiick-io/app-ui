name: OpenSSF Scorecard

on:
  workflow_call:
    inputs:
      is-public-fleet:
        description: Public visibility verified by fleet-security-check
        type: boolean
        required: true
      is-default-branch:
        description: Default branch verified by fleet-security-check
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  scorecard:
    if: github.repository_owner == 'qiick-io' && inputs.is-public-fleet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Scorecard's public API accepts results from the default branch only.
          publish_results: ${{ inputs.is-default-branch }}
          fail_on_publish_error: true
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: ${{ !cancelled() && hashFiles('scorecard.sarif') != '' }}
        with:
          sarif_file: scorecard.sarif
          category: openssf-scorecard
