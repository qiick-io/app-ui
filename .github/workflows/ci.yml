name: ci

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
    # `edited` reruns the checks when a PR title changes, so a fixed title turns
    # `pr-title` green without closing and reopening the PR (rules/git.md).
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# The event is part of the group: without it the `push` run and the
# `pull_request` run on the same SHA cancel each other, and a required check
# that was cancelled never reports (externa-core#805). Runs on `main` and
# `develop` are the release evidence, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Dead code (knip)
        run: npm run knip
      - name: Hard-coded UI strings (ratchet)
        run: npm run lint:i18n
      - name: Restricted imports, boolean names, short names (ratchet)
        run: npm run lint:standards
      # Chrome's legacy-scan, ratcheted against legacy-scan-baseline.json: a step
      # here and not a job of its own (rules/checks.md: GitHub bills per job).
      - name: Legacy web platform patterns (ratchet)
        run: npm run lint:legacy

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run types:check

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: WCAG 2.2 AA contrast of every token pair
        run: npm run a11y:contrast
      - name: Script and component tests (drift check, standards sync, Vitest)
        run: npm test
      # This repo follows its own standards pack: its synced copy must match standards/.
      - name: Standards pack is synced
        run: npm run standards:check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build theme, registry and playground
        run: npm run build
      # Apps install from the committed public/r at a release tag (#4), so it must never be stale.
      - name: Registry is committed and up to date
        run: |
          npm run registry:check
          git status --porcelain -- public/r
          test -z "$(git status --porcelain -- public/r)"

  # RED/GREEN proofs for every fleet conformance check (standards/php/conformance-harness).
  # Engine-dependent proofs also run on PostgreSQL, MySQL and MariaDB service containers.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql, mysql, mariadb]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: conformance
          POSTGRES_USER: conformance
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conformance -d conformance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: conformance
          MYSQL_USER: conformance
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psecret --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: conformance
          MARIADB_USER: conformance
          MARIADB_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: secret
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql, pgsql, mysql
          coverage: none
          tools: composer:v2
      - name: Install and prove RED/GREEN
        working-directory: standards/php/conformance-harness
        env:
          DB_CONNECTION: ${{ matrix.database == 'sqlite' && 'sqlite' || matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || matrix.database == 'mysql' && '3306' || matrix.database == 'mariadb' && '3307' || '' }}
          DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'conformance' }}
          DB_USERNAME: ${{ matrix.database == 'sqlite' && '' || 'conformance' }}
          DB_PASSWORD: ${{ matrix.database == 'sqlite' && '' || 'secret' }}
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer test

  # PRs are squash-merged, so the PR title becomes the commit on develop.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
