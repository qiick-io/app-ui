# Reusable forward-only migration check (qiick standards, "Contracts: never break
# them"): a migration that exists on `main`, on the latest `v*` tag or in the
# freeze baseline `database/migrations/.frozen` is never edited, renamed or
# deleted. From excubia-app #193.
#
# In the app:
#
#   jobs:
#     migrations-frozen:
#       uses: qiick-io/app-ui/.github/workflows/migrations-frozen.yml@vX.Y.Z
#
# Required check name: `migrations-frozen / migrations-frozen`.
name: migrations frozen

on:
  workflow_call:
    inputs:
      working-directory:
        description: App root (where qiick-standards.json and database/migrations live)
        type: string
        default: .

permissions:
  contents: read

jobs:
  migrations-frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # `main`, the release tags and the base branch.
          fetch-depth: 0

      - name: Read the pinned standards ref
        id: pin
        working-directory: ${{ inputs.working-directory }}
        run: |
          ref=$(node -e "process.stdout.write(require('./qiick-standards.json').ref ?? '')")
          if [ -z "$ref" ]; then
            echo "::error::qiick-standards.json needs \"ref\": \"<app-ui tag or branch>\""
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: qiick-io/app-ui
          ref: ${{ steps.pin.outputs.ref }}
          path: .app-ui
          sparse-checkout: standards/scripts

      - name: Check frozen migrations
        working-directory: ${{ inputs.working-directory }}
        env:
          BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: bash "$GITHUB_WORKSPACE/.app-ui/standards/scripts/migrations-frozen.sh" "$BASE_REF"
