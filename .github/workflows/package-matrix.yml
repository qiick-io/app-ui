# Reusable Laravel/PHP compatibility matrix for every qiick Composer package.
# Source of truth: standards/package-matrix.json. Docs: docs/package-matrix.md.
#
# In a package:
#
#   jobs:
#     package-matrix:
#       uses: qiick-io/app-ui/.github/workflows/package-matrix.yml@vX.Y.Z
#     tests:
#       needs: package-matrix
#       strategy:
#         fail-fast: false
#         matrix: ${{ fromJSON(needs.package-matrix.outputs.matrix) }}
#     databases:
#       needs: package-matrix
#       strategy:
#         fail-fast: false
#         matrix:
#           database: ${{ fromJSON(needs.package-matrix.outputs.databases) }}
#
# Required check name (once the package opts in with "package": true): the
# standards drift job (`app-ui-drift / standards`) fails when the package's CI
# does not consume these outputs.
name: package matrix

on:
  workflow_call:
    outputs:
      matrix:
        description: >-
          GitHub Actions matrix object (php × laravel × dependency-version,
          Testbench includes, documented excludes) as a JSON string
        value: ${{ jobs.export.outputs.matrix }}
      databases:
        description: >-
          Database service list (SQLite, PostgreSQL 17, MySQL 8.4, MariaDB 10.11
          with pinned image digests) as a JSON string
        value: ${{ jobs.export.outputs.databases }}

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      databases: ${{ steps.read.outputs.databases }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: qiick-io/app-ui
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            standards/package-matrix.json
          sparse-checkout-cone-mode: false

      - name: Export the shared matrix and database list
        id: read
        run: |
          set -euo pipefail

          if [ ! -f standards/package-matrix.json ]; then
            echo "::error::standards/package-matrix.json is missing at workflow_sha=${{ github.workflow_sha }}"
            exit 1
          fi

          {
            echo 'matrix<<EOF'
            jq -c '.matrix' standards/package-matrix.json
            echo 'EOF'
            echo 'databases<<EOF'
            jq -c '.databases' standards/package-matrix.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
