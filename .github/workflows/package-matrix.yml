# Reusable Laravel/PHP compatibility matrix for every qiick Composer package.
# Source of truth: standards/package-matrix.json. Docs: docs/package-matrix.md.
#
# In a package:
#
#   jobs:
#     package-matrix:
#       uses: qiick-io/app-ui/.github/workflows/package-matrix.yml@vX.Y.Z
#       with:
#         app-ui-ref: <same commit SHA as the uses ref>
#         exclude-php-versions: '["8.3"]' # laravel-audit only
#     tests:
#       needs: package-matrix
#       strategy:
#         fail-fast: false
#         matrix: ${{ fromJSON(needs.package-matrix.outputs.matrix) }}
#     databases:
#       needs: package-matrix
#       strategy:
#         fail-fast: false
#         matrix:
#           database: ${{ fromJSON(needs.package-matrix.outputs.databases) }}
#
# Required check name (once the package opts in with "package": true): the
# standards drift job (`app-ui-drift / standards`) fails when the package's CI
# does not consume these outputs.
name: package matrix

on:
  workflow_call:
    inputs:
      app-ui-ref:
        description: Commit SHA or release tag in qiick-io/app-ui used to load the matrix
        required: true
        type: string
      exclude-php-versions:
        description: JSON array of unsupported PHP versions to remove for this package
        required: false
        default: '[]'
        type: string
    outputs:
      matrix:
        description: >-
          GitHub Actions matrix object (php × laravel × dependency-version,
          Testbench includes, package PHP exclusions) as a JSON string
        value: ${{ jobs.export.outputs.matrix }}
      databases:
        description: >-
          Service-container database list (PostgreSQL 17, MySQL 8.4, MariaDB 11.4
          with pinned image digests); SQLite is covered by the package test matrix
        value: ${{ jobs.export.outputs.databases }}

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      databases: ${{ steps.read.outputs.databases }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: qiick-io/app-ui
          ref: ${{ inputs.app-ui-ref }}
          sparse-checkout: |
            standards/package-matrix.json
            scripts/export-package-matrix.mjs
          sparse-checkout-cone-mode: false

      - name: Export the shared matrix and database list
        id: read
        env:
          EXCLUDE_PHP_VERSIONS: ${{ inputs.exclude-php-versions }}
        run: |
          set -euo pipefail

          if [ ! -f standards/package-matrix.json ]; then
            echo "::error::standards/package-matrix.json is missing from app-ui-ref"
            exit 1
          fi

          node scripts/export-package-matrix.mjs >> "$GITHUB_OUTPUT"
